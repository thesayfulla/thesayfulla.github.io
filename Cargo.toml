[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"
description = "Personal site + blog."
publish = false

[dependencies]
ammonia = "4.2"
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
html-escape = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Bundled SQLite for diesel.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
md-5 = "0.11"
minijinja = { version = "3", features = ["serde", "json"] }
pbkdf2 = "0.13"
rand = "0.10"
regex = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-normalization = "0.1"
url = "2.5"
walkdir = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Password hashing (1.5M PBKDF2 rounds) and image resizing are painfully slow
# unoptimized, so dependencies are always built with optimizations.
[profile.dev.package."*"]
opt-level = 3
